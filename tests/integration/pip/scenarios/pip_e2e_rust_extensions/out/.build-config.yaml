environment_variables:
- name: CARGO_HOME
  value: ${output_dir}/.cargo
- name: PIP_FIND_LINKS
  value: ${output_dir}/deps/pip
- name: PIP_NO_INDEX
  value: 'true'
project_files:
- abspath: ${test_case_tmp_path}/../hermeto-output/.cargo/config.toml
  template: |
    [source.crates-io]
    replace-with = "vendored-sources"

    [source.vendored-sources]
    directory = "${output_dir}/deps/cargo"
- abspath: ${test_case_tmp_path}/requirements.txt
  template: |
    hello @ file://${output_dir}/deps/pip/hello-7d20a86f43cfdc7f71f679d9ff135fb0bfcb954d98ed61e00190a800a096a903.zip --hash=sha256:7d20a86f43cfdc7f71f679d9ff135fb0bfcb954d98ed61e00190a800a096a903
