environment_variables:
- name: UV_FIND_LINKS
  value: ${output_dir}/deps/uv
- name: UV_FROZEN
  value: 'true'
- name: UV_OFFLINE
  value: 'true'
project_files:
- abspath: ${test_case_tmp_path}/uv.lock
  template: |
    version = 1
    revision = 3
    requires-python = ">=3.12"

    [[package]]
    name = "anyio"
    version = "4.16.0"
    source = { registry = "https://pypi.org/simple" }
    dependencies = [
        { name = "idna" },
        { name = "typing-extensions", marker = "python_full_version < '3.15'" },
    ]
    sdist = { url = "file://${output_dir}/deps/uv/anyio-4.16.0.tar.gz", hash = "sha256:59bb03251907983d1603d27c3087ddb1e93299ea2163adcdba37899a4fb12ffb" }
