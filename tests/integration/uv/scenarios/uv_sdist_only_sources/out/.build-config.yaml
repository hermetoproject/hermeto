environment_variables:
- name: UV_FIND_LINKS
  value: ${output_dir}/deps/uv
- name: UV_FROZEN
  value: 'true'
- name: UV_NO_BINARY
  value: 'true'
- name: UV_OFFLINE
  value: 'true'
project_files:
- abspath: ${test_case_tmp_path}/uv.lock
  template: |
    version = 1
    revision = 3
    requires-python = ">=3.12"

    [[package]]
    name = "idna"
    version = "3.10"
    source = { registry = "https://pypi.org/simple" }
    sdist = { url = "file://${output_dir}/deps/uv/idna-3.10.tar.gz", hash = "sha256:12f65c9b470abda6dc35cf8e63cc574b1c52b11df2c86030af0ac09b01b13ea9", size = 190490, upload-time = "2024-09-15T18:07:39.745Z" }
    wheels = [
        { url = "file://${output_dir}/deps/uv/idna-3.10-py3-none-any.whl", hash = "sha256:946d195a0d259cbba61165e88e65941f16e9b36ea6ddb97f00452bae8b1287d3", size = 70442, upload-time = "2024-09-15T18:07:37.964Z" },
    ]

    [[package]]
    name = "itsdangerous"
    version = "2.2.0"
    source = { path = "${output_dir}/deps/uv/itsdangerous-gitcommit-096c8d42545d3b68ea21a4f890fb2b2d8979c0bd.tar.gz" }

    [[package]]
    name = "localpkg"
    version = "0.1.0"
    source = { path = "vendor/localpkg-0.1.0.tar.gz" }
    sdist = { hash = "sha256:b8121b2d6560d293fbc229abaa9c247cf5dd4eb9a94657c3c005bad0a5b255cf" }

    [[package]]
    name = "packaging"
    version = "25.0"
    source = { path = "${output_dir}/deps/uv/packaging-25.0.tar.gz" }
    sdist = { hash = "sha256:d443872c98d677bf60f6a1f2f8c1cb748e8fe762d2bf9d3148b5599295b0fc4f" }

    [[package]]
    name = "uv-sdist-sources"
    version = "0.1.0"
    source = { editable = "." }
    dependencies = [
        { name = "idna" },
        { name = "itsdangerous" },
        { name = "localpkg" },
        { name = "packaging" },
    ]

    [package.metadata]
    requires-dist = [
        { name = "idna", specifier = "==3.10" },
        { name = "itsdangerous", git = "https://github.com/pallets/itsdangerous?tag=2.2.0" },
        { name = "localpkg", path = "vendor/localpkg-0.1.0.tar.gz" },
        { name = "packaging", url = "https://files.pythonhosted.org/packages/a1/d4/1fc4078c65507b51b96ca8f8c3ba19e6a61c8253c72794544580a7b6c24d/packaging-25.0.tar.gz" },
    ]
