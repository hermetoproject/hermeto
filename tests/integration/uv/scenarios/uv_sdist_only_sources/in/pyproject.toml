[project]
name = "uv-sdist-sources"
version = "0.1.0"
description = "uv source kinds(major) that resolves to an sdist"
requires-python = ">=3.12"
dependencies = [
    "idna==3.10",   #registry source
    "packaging",    #url source
    "itsdangerous", #git source
    "localpkg",     #path(local) source
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
itsdangerous = { git = "https://github.com/pallets/itsdangerous", tag = "2.2.0" }
localpkg = { path = "vendor/localpkg-0.1.0.tar.gz" }
packaging = { url = "https://files.pythonhosted.org/packages/a1/d4/1fc4078c65507b51b96ca8f8c3ba19e6a61c8253c72794544580a7b6c24d/packaging-25.0.tar.gz" }

[tool.hatch.build.targets.wheel]
packages = ["src/uv_sdist_sources"]
