environment_variables:
- name: UV_FIND_LINKS
  value: ${output_dir}/deps/uv
- name: UV_FROZEN
  value: 'true'
- name: UV_NO_BINARY
  value: 'true'
- name: UV_OFFLINE
  value: 'true'
project_files:
- abspath: ${test_case_tmp_path}/uv.lock
  template: |
    version = 1
    revision = 3
    requires-python = ">=3.12"

    [[package]]
    name = "nested-example"
    version = "0.1.0"
    source = { path = "${output_dir}/deps/uv/nested-example-gitcommit-ab3ddbf20f05ec98636c84c996934935541fc63e-libs%2Fexample.tar.gz" }

    [[package]]
    name = "uv-package-inside-subdirectory"
    version = "0.1.0"
    source = { editable = "." }
    dependencies = [
        { name = "nested-example" },
    ]

    [package.metadata]
    requires-dist = [
        { name = "nested-example", git = "https://git.example.invalid/hermeto-tests/nested-example.git?subdirectory=libs%2Fexample&rev=ab3ddbf20f05ec98636c84c996934935541fc63e" },
    ]
